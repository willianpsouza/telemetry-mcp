global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: provengo-telemetry

scrape_configs:
  # Metrics forwarded by the OTel Collector (all Provengo services land here).
  - job_name: otel-collector-apps
    honor_labels: true
    static_configs:
      - targets: ["otel-collector:8889"]

  # Collector's own health/throughput metrics.
  - job_name: otel-collector-internal
    static_configs:
      - targets: ["otel-collector:8888"]

  # Prometheus self-monitoring.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
