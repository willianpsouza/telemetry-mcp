# ===========================================================================
# Provengo Observability Framework
# Standalone stack for Provengo services, fronted by a single Caddy entrypoint.
#
#   apps --OTLP+token--> Caddy(ingest.) -> registry proxy -> OTel Collector --> Prometheus
#                                                                            --> Jaeger
#                                                                            --> Loki
#   operators -> Caddy(obs./grafana./docs.) -> registry / grafana / docs-server
#   Claude    -> Caddy(mcp.) -> mcp-server (Bearer)
#   Cloudflare Tunnel -> Caddy:80   (profile "edge")
#
# Internal backends are NOT published to the host; Caddy is the only entrypoint.
# For a trusted-LAN deploy without Caddy, re-add `ports:` as needed.
# See docs/DEPLOYMENT.md and docs/EDGE.md.
# ===========================================================================

name: provengo-observability

services:
  # ---- Caddy: single reverse-proxy entrypoint (routes by subdomain) ----
  caddy:
    image: caddy:2.9-alpine
    restart: unless-stopped
    environment:
      BASE_DOMAIN: ${BASE_DOMAIN:-localhost}
      EDGE_HOSTNAME: ${EDGE_HOSTNAME:-localhost}
    volumes:
      - ./config/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - "${EDGE_HTTP_PORT:-80}:80"
    depends_on:
      - registry
      - grafana
      - docs-server
      - mcp-server
    networks: [telemetry]

  # ---- Cloudflare Tunnel: exposes Caddy publicly without opening a port ----
  # Enable with:  docker compose --profile edge up -d
  cloudflared:
    image: cloudflare/cloudflared:2025.1.0
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - caddy
    networks: [telemetry]
    profiles: ["edge"]

  # ---- OpenTelemetry Collector: ingestion point, fans signals out ----
  otel-collector:
    # Wrapper image: upstream contrib binary re-homed onto a glibc base so it
    # runs on runtimes where the scratch image's missing loader breaks exec.
    build:
      context: ./collector
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./config/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    expose: ["4317", "4318", "8888", "8889"]
    # For a trusted-LAN gRPC path (no token), publish OTLP yourself:
    # ports: ["4317:4317", "4318:4318"]
    depends_on:
      - prometheus
      - jaeger
      - loki
    networks: [telemetry]

  # ---- Prometheus: metrics storage + PromQL ----
  prometheus:
    image: prom/prometheus:v3.1.0
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=${PROM_RETENTION:-15d}"
      - "--web.enable-remote-write-receiver"
      - "--enable-feature=exemplar-storage"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    expose: ["9090"]
    networks: [telemetry]

  # ---- Jaeger: trace storage + query/UI (accepts OTLP natively) ----
  jaeger:
    image: jaegertracing/all-in-one:1.65.0
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      METRICS_STORAGE_TYPE: prometheus
      PROMETHEUS_SERVER_URL: http://prometheus:9090
    expose: ["16686", "4317"]
    networks: [telemetry]

  # ---- Loki: log storage + LogQL (accepts OTLP logs natively) ----
  loki:
    image: grafana/loki:3.3.2
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./config/loki-config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    expose: ["3100"]
    networks: [telemetry]

  # ---- Grafana: dashboards over all three datasources ----
  grafana:
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_FEATURE_TOGGLES_ENABLE: "traceqlEditor"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost/grafana}
      GF_SERVER_SERVE_FROM_SUB_PATH: ${GRAFANA_SUB_PATH:-true}
      GF_SERVER_DOMAIN: ${EDGE_HOSTNAME:-localhost}
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    expose: ["3000"]
    depends_on:
      - prometheus
      - jaeger
      - loki
    networks: [telemetry]

  # ---- MCP server: exposes telemetry to Claude over HTTP (Bearer auth) ----
  mcp-server:
    build:
      context: ./mcp-server
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      MCP_TRANSPORT: http
      MCP_HTTP_ADDR: ":8080"
      MCP_PROMETHEUS_URL: ${MCP_PROMETHEUS_URL:-http://prometheus:9090}
      MCP_JAEGER_URL: ${MCP_JAEGER_URL:-http://jaeger:16686}
      MCP_LOKI_URL: ${MCP_LOKI_URL:-http://loki:3100}
      MCP_DEFAULT_LOOKBACK: ${MCP_DEFAULT_LOOKBACK:-1h}
      MCP_HTTP_TIMEOUT: ${MCP_HTTP_TIMEOUT:-30s}
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:-}
    expose: ["8080"]
    depends_on:
      - prometheus
      - jaeger
      - loki
    networks: [telemetry]

  # ---- Docs server: serves the integration .md guides as HTML (chi) ----
  docs-server:
    build:
      context: ./docs-server
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DOCS_ADDR: ":8081"
      DOCS_DIR: "/docs"
      DOCS_EXTRA_DIR: "/extra"
      DOCS_BASE_PATH: "${DOCS_BASE_PATH:-}"
    volumes:
      - ./docs:/docs:ro
      # Mounted in its OWN dir (not nested under the read-only /docs mount).
      - ./INTEGRATE.md:/extra/INTEGRATE.md:ro
    expose: ["8081"]
    networks: [telemetry]

  # ---- Registry: onboarding console + app registry + OTLP auth proxy ----
  registry:
    build:
      context: ./registry
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      REGISTRY_ADDR: ":8082"
      REGISTRY_OTLP_PROXY_ADDR: ":4319"
      REGISTRY_COLLECTOR_OTLP: "http://otel-collector:4318"
      REGISTRY_DB_PATH: "/data/registry.db"
      REGISTRY_ADMIN_USER: "${REGISTRY_ADMIN_USER:-admin}"
      REGISTRY_ADMIN_PASSWORD: "${REGISTRY_ADMIN_PASSWORD:-admin}"
      # Host apps use in the generated snippet (the public ingest hostname).
      REGISTRY_TELEMETRY_HOST: "${REGISTRY_TELEMETRY_HOST:-ingest.localhost}"
      REGISTRY_INGEST_PORT: "${REGISTRY_INGEST_PORT:-80}"
      REGISTRY_INGEST_SCHEME: "${REGISTRY_INGEST_SCHEME:-http}"
      # Path prefix for path-routed edges (e.g. "/ingest"); empty for subdomain routing.
      REGISTRY_INGEST_PATH: "${REGISTRY_INGEST_PATH:-}"
      REGISTRY_HEALTH_INTERVAL: "30s"
    volumes:
      - registry-data:/data
    expose: ["8082", "4319"]
    depends_on:
      - otel-collector
    networks: [telemetry]

networks:
  telemetry:
    driver: bridge

volumes:
  prometheus-data:
  loki-data:
  grafana-data:
  registry-data:
  caddy-data:
  caddy-config:
